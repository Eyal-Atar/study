version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      api:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only. Remove this rule
      # once it supports TypeScript 7, then upgrade TypeScript by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Pinned to ^24 to match the Node 24 runtime. Remove when the runtime moves to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # legacy/ is reference only and is deleted at the end of phase 4. Its alerts
  # still show in the Security tab; this entry only stops update pull requests.
  - package-ecosystem: pip
    directories:
      - /legacy/backend
      - /legacy/backend/eval
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
