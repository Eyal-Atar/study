<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ארצ׳י · כל המסכים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0e4;--surface:#f8f7f0;--ink:#3b2a1e;--muted:#6e5948;--line:#d9d6c3;--soft:#e6e7d8;
  --brand:#4f7a3a;--brand-ink:#3f6430;--sprout:#8db45e;--clay:#9a5f38;--sand:#c9a77c;--gold:#d4a24c;
  --sky1:#96c6e8;--sky2:#d6ecf8;--now:#c2502e;--now-ink:#a8401f;--busy:#dcd8c6;
  --e1:#6b7a2f;--e1b:#eef0d9;--e1l:#c9cf9c;
  --e2:#b0532f;--e2b:#f8e6dc;--e2l:#e8b79d;
  --e3:#4a6b84;--e3b:#e2ebf2;--e3l:#a9c0d2;
  --e4:#7b4a6d;--e4b:#f1e3ec;--e4l:#d2aec6;
  --f:'Rubik',system-ui,sans-serif;--disp:'Amatic SC','Rubik',sans-serif;
  font-family:var(--f);
}
*{box-sizing:border-box}
html,body{margin:0;background:#e2e3d4;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.page{max-width:1400px;margin:0 auto;padding:28px 16px 80px}
.head{text-align:center;margin-bottom:22px}
.head h1{font-family:var(--disp);font-size:72px;line-height:1;margin:0}
.head p{color:var(--muted);margin:6px 0 0}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 30px;position:sticky;top:0;padding:10px;background:#e2e3d4;z-index:50}
.nav a{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
section{margin-bottom:56px}
section > h2{font-family:var(--disp);font-size:52px;margin:0 0 4px;line-height:1}
section > p{color:var(--muted);margin:0 0 18px;max-width:70ch}
.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.cap{text-align:center;font-size:14px;margin-top:10px;font-weight:600}
.cap small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;max-width:330px;margin:2px auto 0}

/* frames */
.ph{width:340px;height:736px;border-radius:40px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 9px #2b2119,0 24px 50px rgba(59,42,30,.25);display:flex;flex-direction:column;font-size:14px}
.dk{width:1180px;height:720px;border-radius:16px;overflow:hidden;background:var(--bg);box-shadow:0 24px 60px rgba(59,42,30,.22);display:grid;grid-template-columns:290px 1fr;grid-template-rows:60px 1fr;font-size:14px}
.status{height:40px;flex:none}
.sc{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.pad{padding:0 18px}

/* shared bits */
.av{border-radius:50%;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.9) translateY(4%)}
.art{border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.chip.leaf{background:#e3edd5;color:var(--brand-ink)}
.chip.gold{background:#f6e7c6;color:#6b4a12}
.lvl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:conic-gradient(var(--gold) 0 62%,#eadfc4 0);position:relative}
.lvl::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.lvl b{position:relative;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-weight:600;width:100%}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.clay{background:var(--clay);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.say{display:flex;gap:10px;align-items:flex-end}
.say .b{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 12px;line-height:1.45;font-size:13.5px;box-shadow:0 4px 12px rgba(59,42,30,.06)}
.say .b small{display:block;color:var(--muted);font-size:11px}
.h1{font-size:23px;font-weight:700;margin:4px 0 4px;line-height:1.25}
.mut{color:var(--muted)}
.tabbar{height:70px;flex:none;background:rgba(248,247,240,.97);border-top:1px solid var(--line);display:flex;padding:8px 14px 18px}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted)}
.tabbar span.on{color:var(--brand-ink);font-weight:600}
.tabbar svg{width:21px;height:21px}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(59,42,30,.25);padding:10px 18px 22px;z-index:20}
.sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
.scrim{position:absolute;inset:0;background:rgba(43,33,25,.35);z-index:15}
.opt{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
.opt .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--soft)}
.opt b{display:block}
.opt small{color:var(--muted)}
.steps{display:flex;gap:5px;flex:1}.steps i{flex:1;height:5px;border-radius:5px;background:var(--soft)}.steps i.on{background:var(--brand)}
.field{height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;padding:0 12px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);margin-bottom:5px}

/* calendar */
.grid{position:relative;display:grid}
.hrs{position:relative}
.hrs div{position:absolute;width:100%;text-align:center;font-size:10.5px;color:var(--muted);transform:translateY(-7px)}
.col{position:relative;border-inline-start:1px solid #e3e2d3}
.hl{position:absolute;inset-inline:0;border-top:1px solid #e3e2d3}
.blk{position:absolute;inset-inline:3px;border-radius:9px;padding:5px 7px;border:1px solid;border-inline-start-width:4px;overflow:hidden;font-size:11.5px;line-height:1.25}
.blk .t{font-weight:600;color:var(--ink);display:flex;gap:5px;align-items:flex-start}
.blk .m{color:var(--muted);font-size:10.5px;margin-top:2px}
.blk .cb{width:15px;height:15px;border-radius:5px;border:2px solid currentColor;flex:none;margin-top:1px;background:#fff;display:grid;place-items:center}
.blk.done{opacity:.6}.blk.done .t span{text-decoration:line-through}
.blk.done .cb{background:var(--brand);border-color:var(--brand)}
.blk.done .cb::after{content:"✓";color:#fff;font-size:10px;line-height:1}
.ex1{color:var(--e1);background:var(--e1b);border-color:var(--e1l)}
.ex2{color:var(--e2);background:var(--e2b);border-color:var(--e2l)}
.ex3{color:var(--e3);background:var(--e3b);border-color:var(--e3l)}
.ex4{color:var(--e4);background:var(--e4b);border-color:var(--e4l)}
.busy{position:absolute;inset-inline:3px;border-radius:9px;background:repeating-linear-gradient(135deg,#e4e1d0 0 6px,#ecead9 6px 12px);border:1px dashed #c9c4ad;padding:5px 7px;font-size:11px;color:var(--muted)}
.nowl{position:absolute;inset-inline:0;border-top:2px solid var(--now);z-index:5}
.nowl::before{content:"";position:absolute;inset-inline-start:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.nowt{position:absolute;inset-inline-start:2px;transform:translateY(-50%);background:var(--now);color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;z-index:6}
.dstrip{display:flex;gap:3px;padding:4px 10px 8px}
.dstrip div{flex:1;text-align:center;padding:5px 0;border-radius:12px;font-size:10.5px;color:var(--muted)}
.dstrip div b{display:block;font-size:15px;color:var(--ink);margin-top:1px}
.dstrip div.on{background:var(--ink);color:#e8dfcf}.dstrip div.on b{color:#fff}
.dstrip .dots{display:flex;gap:2px;justify-content:center;height:5px;margin-top:2px}.dstrip .dots i{width:4px;height:4px;border-radius:50%}
.leafmark{font-size:9px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:30px;line-height:1}
.tabs{display:flex;gap:4px;margin-inline-start:18px}
.tabs span{padding:7px 13px;border-radius:10px;color:var(--muted);font-weight:500}
.tabs span.on{background:#e3edd5;color:var(--brand-ink)}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.side h4{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:500}
.task{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:11px;background:var(--bg);margin-bottom:5px;font-size:13px}
.task i{width:4px;align-self:stretch;border-radius:4px}
.task .cb{width:19px;height:19px;border-radius:6px;border:2px solid currentColor;background:#fff;margin-inline-start:auto;flex:none}
.task.d{color:var(--muted)}.task.d span{text-decoration:line-through}
.task.d .cb{background:var(--brand);border-color:var(--brand)}
.ring{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--sprout) 0 46%,#e3e2d3 0);display:grid;place-items:center;flex:none}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px}
.examrow{display:grid;grid-template-columns:10px 1fr auto;gap:3px 8px;align-items:center;font-size:13px;margin-bottom:9px}
.examrow .sw{width:10px;height:10px;border-radius:3px}
.examrow .bar{grid-column:2/-1;height:5px;border-radius:5px;background:#e3e2d3;overflow:hidden}.examrow .bar i{display:block;height:100%}
.banner{margin:0 18px 8px;border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;font-size:13px}
.toast{position:absolute;inset-inline:14px;bottom:84px;background:var(--ink);color:#f3ead9;border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center;font-size:13px;z-index:30}
.toast b{color:#cfe3b4;margin-inline-start:auto}
.fab{position:absolute;bottom:84px;inset-inline-start:16px;background:var(--brand);color:#fff;border-radius:999px;padding:11px 16px;font-weight:600;font-size:13px;box-shadow:0 8px 20px rgba(79,122,58,.4);z-index:12}
.badge{border-radius:14px;padding:10px 6px;text-align:center;font-size:11px;background:var(--surface);border:1px solid var(--line)}
.badge .em{font-size:22px}
.badge.off{border-style:dashed;color:var(--muted)}
.garden{height:170px;border-radius:20px;background:linear-gradient(var(--sky1),var(--sky2) 70%,#e7dcc4 70%);position:relative;overflow:hidden}
.garden .ph-note{position:absolute;inset-inline:0;bottom:8px;text-align:center;font-size:11px;color:var(--muted)}
.sw8{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.sw8:first-child{border-top:0}
.toggle{width:40px;height:24px;border-radius:999px;background:var(--brand);position:relative;margin-inline-start:auto}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.lock{background:linear-gradient(160deg,#5b7f9a,#a9c7d9 60%,#e4d6bd);}
</style>
</head>
<body>
<div class="page">
  <div class="head"><h1>ארצ׳י</h1><p>כל המסכים בעיצוב החדש: היומן שאושר, הפלטה של ארצ׳י, והאיורים. נתוני דמה.</p></div>
  <nav class="nav">
    <a href="#s1">כניסה ואונבורדינג</a><a href="#s2">יומן</a><a href="#s3">פעולות ביומן</a><a href="#s4">מבחנים</a><a href="#s5">התקדמות והגן</a><a href="#s6">הגדרות</a><a href="#s7">רגעים ומצבים</a>
  </nav>
  <div id="root"></div>
</div>
<script>
const IMG=n=>`archie/${n}.jpg`;
const EX=[null,['הסתברות',1],['אלגוריתמים',2],['שפת C',3],['מבני נתונים',4]];
const H=40,S=8,E=22;
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ICON={cal:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',exam:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>',prog:'<path d="M12 21c-4-2-7-6-7-10a7 7 0 0 1 14 0c0 4-3 8-7 10z"/><path d="M12 21V11"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICON[k]}</svg>`;
const tabbar=on=>`<div class="tabbar">${[['cal','יומן'],['exam','מבחנים'],['prog','התקדמות']].map(([k,l],i)=>`<span class="${i===on?'on':''}">${svg(k)}${l}</span>`).join('')}</div>`;
const ph=(inner,cap,sub='')=>`<div><div class="ph"><div class="status"></div><div class="sc">${inner}</div></div><div class="cap">${cap}<small>${sub}</small></div></div>`;
const av=(n='joy',s=36)=>`<div class="av" style="width:${s}px;height:${s}px"><img src="${IMG(n+'-dawn')}" alt=""></div>`;
const phHead=(title,sub,right='')=>`<div class="pad" style="display:flex;align-items:center;gap:10px;padding-top:6px;padding-bottom:6px"><div style="flex:1"><div class="h1" style="margin:0">${title}</div><div class="mut" style="font-size:12.5px">${sub}</div></div>${right}</div>`;
const gam=`<span class="chip leaf">🌿 12</span><div class="lvl"><b>4</b></div>`;
const obTop=(n)=>`<div class="pad" style="display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:4px"><span style="width:36px;height:36px;border-radius:11px;background:var(--soft);display:grid;place-items:center">→</span><div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div><span class="mut" style="font-size:11.5px">${n} מתוך 4</span></div>`;
const obFoot=(cta,sec='')=>`<div class="pad" style="margin-top:auto;padding-bottom:22px">${sec}<div class="btn pri">${cta}</div></div>`;

const BL=[ // day, start(min), len, exam, title, done
 [0,540,90,1,'למידה: משתנים מקריים',1],[0,660,60,2,'תרגול: עצי חיפוש',1],[0,960,60,3,'חזרה: מצביעים',1],
 [1,540,90,2,'למידה: מיון מהיר',1],[1,840,90,1,'תרגול: נורמלית',1],[1,1140,60,4,'למידה: ערמות',1],
 [2,600,90,1,'חזרה: תוחלת ושונות',1],[2,720,60,2,'למידה: גרפים ו-BFS',0],[2,1050,90,3,'תרגול: malloc ו-free',0],[2,1200,45,4,'חזרה: טבלאות גיבוב',0],
 [3,540,90,3,'למידה: מבנים',0],[3,840,60,1,'סימולציה: מועד א׳',0],[3,1140,60,2,'תרגול: תכנון דינמי',0],
 [4,600,90,2,'תרגול: דייקסטרה',0],[4,780,60,4,'למידה: עצי AVL',0],[4,1020,90,1,'סימולציה: מועד ב׳',0],
 [5,600,60,3,'חזרה: קבצים',0],[5,720,60,1,'חזרה: הסתברות מותנית',0]];
const BUSY=[[0,840,120,'עבודה'],[2,840,180,'עבודה · משמרת'],[3,600,120,'הרצאה: אלגוריתמים'],[4,1140,120,'חתונה של נועה']];
const TODAY=2,NOW=11*60+25;
const blk=(b,compact)=>{const [d,s,l,e,t,dn]=b;const h=l/60*H-3;return `<div class="blk ex${e} ${dn?'done':''}" style="top:${(s/60-S)*H+1}px;height:${h}px"><div class="t"><span class="cb"></span><span>${t}</span></div>${h>30&&!compact?`<div class="m"><span class="ltr">${fmt(s)}–${fmt(s+l)}</span> · ${EX[e][0]}</div>`:''}</div>`};
const busy=b=>`<div class="busy" style="top:${(b[1]/60-S)*H+1}px;height:${b[2]/60*H-3}px">${b[3]}</div>`;
const lines=()=>{let s='';for(let h=S;h<E;h++)s+=`<div class="hl" style="top:${(h-S)*H}px"></div>`;return s};
const hours=(now)=>{let s='';for(let h=S+1;h<E;h++)s+=`<div style="top:${(h-S)*H}px">${String(h).padStart(2,'0')}:00</div>`;if(now)s+=`<span class="nowt" style="top:${(NOW/60-S)*H}px">${fmt(NOW)}</span>`;return `<div class="hrs" style="height:${(E-S)*H}px">${s}</div>`};
const dayCol=(d,extra='')=>`<div class="col" style="height:${(E-S)*H}px;${d===TODAY?'background:#f2f3e7':''}">${lines()}${BUSY.filter(b=>b[0]===d).map(busy).join('')}${BL.filter(b=>b[0]===d).map(b=>blk(b)).join('')}${d===TODAY?`<div class="nowl" style="top:${(NOW/60-S)*H}px"></div>`:''}${d===6?`<div style="position:absolute;top:${(13-S)*H}px;inset-inline:0;text-align:center;color:var(--muted);font-size:12px">יום מנוחה ☕</div>`:''}${extra}</div>`;
const DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'],DS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const strip=(on)=>`<div class="dstrip">${DS.map((n,i)=>`<div class="${i===on?'on':''}">${n}<b>${16+i}</b><div class="dots">${i<TODAY?'<span class="leafmark">🌿</span>':[...new Set(BL.filter(b=>b[0]===i).map(b=>b[3]))].map(e=>`<i style="background:var(--e${e})"></i>`).join('')}</div></div>`).join('')}</div>`;
const dayView=(d,scroll=60)=>`<div style="flex:1;overflow:hidden;position:relative;border-top:1px solid var(--line)"><div class="grid" style="grid-template-columns:40px 1fr;margin-top:-${scroll}px">${hours(d===TODAY)}${dayCol(d)}</div></div>`;
const taskRow=(b)=>`<div class="task ${b[5]?'d':''}" style="color:var(--e${b[3]})"><i style="background:var(--e${b[3]})"></i><span style="color:var(--ink)">${b[4]}<br><small class="mut ltr">${fmt(b[1])}</small></span><span class="cb"></span></div>`;

function desktop(){
  const todays=BL.filter(b=>b[0]===TODAY);
  return `<div><div class="dk">
  <div class="topbar"><div class="logo">${av('joy',34)}ארצ׳י</div><div class="tabs"><span class="on">יומן</span><span>מבחנים</span><span>התקדמות</span></div>
    <div style="margin-inline-start:auto;display:flex;align-items:center;gap:8px"><span style="border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:#fff">היום</span><span class="mut">›</span><b style="min-width:150px;text-align:center">16–22 בנובמבר 2026</b><span class="mut">‹</span>
    <span style="background:var(--soft);border-radius:10px;padding:3px;display:flex"><span style="padding:4px 10px">יום</span><span style="padding:4px 10px;background:#fff;border-radius:8px">שבוע</span></span>${gam}${av('joy',34)}</div></div>
